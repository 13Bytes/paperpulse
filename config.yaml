# ============================================================
# Paperpulse — central configuration
# ============================================================
# The application uses this file for branding and summary style.
# The search section is retained only to seed the first topic
# through `python -m api.importer`; live topic searches are stored
# in SQLite and managed through the web application.
# Environment-sensitive secrets (API keys, etc.) stay in .env
# ============================================================

blog:
  title: "Paperpulse"
  tagline: "Discover research across every field"
  description: >-
    Clear, timely ArXiv paper summaries for researchers across every
    discipline. Follow the topics that matter to you and build your own research feed.
  # Used as the Jekyll front-matter title for each post
  post_title: "Daily Research Summary"

search:
  # ArXiv category codes — https://arxiv.org/category_taxonomy
  # Papers must belong to at least one of these categories (when mode includes categories).
  categories:
    - cs.SE    # Software Engineering
    - cs.RO    # Robotics
    - eess.SY  # Systems and Control
    - cs.MA    # Multiagent Systems
    - cs.AI    # Artificial Intelligence
    - cs.CE    # Computational Engineering, Finance, and Science

  # Free-text keyword filters — searched across title and abstract.
  # Papers must match at least one keyword (when mode includes keywords).
  keywords:
    - agentic
    - AI-aided design
    - CAD automation
    - engineering pipeline
    - digital twin
    - autonomous engineering
    - LLM agent
    - agentic pipeline
    - workflow automation
    - simulation framework
    - generative design
    - engineering automation

  # How to combine categories and keywords into the ArXiv query:
  #   categories_and_keywords — paper must match a category AND a keyword  (most precise)
  #   categories_only         — category filter only                        (broader)
  #   keywords_only           — keyword filter only, ignores categories     (broadest)
  mode: categories_and_keywords

summarization:
  # Injected as the opening of every system/user prompt.
  # Change this to shift the expertise framing of the LLM.
  persona: >
    You are an interdisciplinary research scientist and experienced science communicator.
    You can identify important ideas, methods, evidence, and limitations across the natural
    sciences, formal sciences, social sciences, medicine, engineering, and related fields.

  # Injected after the persona. Controls tone and explanation style.
  style: >
    Explain specialist concepts clearly, precisely, and enthusiastically for researchers
    who may not be experts in every field. Preserve important nuance, distinguish evidence
    from speculation, and highlight why each development matters within and across disciplines.
