[project]
name = "paperpulse"
version = "0.1.0"
description = "Daily ArXiv research summariser that publishes Jekyll blog posts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paperpulse contributors" }]

[project.scripts]
paperpulse = "api.main:main"

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"api/tests/*" = ["S101"]
