name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip
          python -m pip install -r api/requirements-dev.txt

      - name: Test
        run: |
          . .venv/bin/activate
          pytest

      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check api

      - name: Compile
        run: |
          . .venv/bin/activate
          python -m compileall -q api

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose config
          docker compose -f docker-compose.prod.yml config

      - name: Build API image
        run: docker compose build api

  jekyll:
    name: Jekyll
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Jekyll image
        run: docker build -f Dockerfile.jekyll -t paperpulse-jekyll .

      - name: Build site
        run: >-
          docker run --rm -e JEKYLL_ENV=production
          -v "$PWD/blog:/srv/jekyll"
          -v "$PWD/config.yaml:/srv/jekyll/_data/paperpulse.yml:ro"
          paperpulse-jekyll jekyll build --disable-disk-cache --destination /tmp/_site
