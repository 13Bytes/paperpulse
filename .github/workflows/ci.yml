name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip
          python -m pip install -r api/requirements-dev.txt

      - name: Test
        run: |
          . .venv/bin/activate
          pytest

      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check api migrations

      - name: Compile
        run: |
          . .venv/bin/activate
          python -m compileall -q api migrations

      - name: Verify database migrations
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/paperpulse-ci.db
        run: |
          . .venv/bin/activate
          alembic upgrade head

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        env:
          PUBLIC_BASE_URL: https://paperpulse.example.invalid
          SESSION_SECRET: ci-only-placeholder-secret
          ADMIN_EMAILS: admin@example.invalid
          SMTP_HOST: smtp.example.invalid
          SMTP_FROM: paperpulse@example.invalid
        run: |
          docker compose config
          docker compose -f docker-compose.prod.yml config

      - name: Build web image
        run: docker compose build web

  jekyll:
    name: Jekyll
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Jekyll image
        run: docker build -f Dockerfile.jekyll -t paperpulse-jekyll .

      - name: Build site
        run: >-
          docker run --rm -e JEKYLL_ENV=production
          -v "$PWD/blog:/srv/jekyll"
          -v "$PWD/config.yaml:/srv/jekyll/_data/paperpulse.yml:ro"
          paperpulse-jekyll jekyll build --disable-disk-cache --destination /tmp/_site
