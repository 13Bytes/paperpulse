services:
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment: &paperpulse-env
      PROJECT_ENV: prod
      PROJECT_DIR: /app
      DATABASE_URL: sqlite:///data/paperpulse.db
      LLM_BACKEND: ${LLM_BACKEND:-codex_cli}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CODEX_HOME: /app/.codex
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-900}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_COOKIE_SECURE: "true"
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    command: alembic upgrade head
    restart: "no"

  web:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "4000:8000"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - codex-home:/app/.codex
    environment: *paperpulse-env
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [web]

  scheduler:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - codex-home:/app/.codex
    environment: *paperpulse-env
    command: supercronic /app/api/crontab
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [web]

volumes:
  codex-home:
networks:
  web:
    driver: bridge
